<body class="bg-light-background text-light-on-surface font-body antialiased overflow-x-hidden">
  <div class="min-h-[1024px] w-full flex bg-light-background relative" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <!-- Contexto de fondo -->
    <div class="flex-1 min-w-0 flex flex-col pointer-events-none select-none" aria-hidden="true">
      <header class="h-12 bg-light-surface-container-lowest border-b border-light-outline-variant px-gutter-lg flex items-center justify-between">
        <div class="flex items-center gap-gutter-md">
          <span class="w-2 h-5 rounded-xs bg-light-primary"></span>
          <span class="font-headline text-headline-md text-light-on-surface">[Nombre del Taller Automotriz]</span>
          <span class="px-2 py-0.5 rounded-xs bg-light-primary-container text-light-on-primary-container font-label text-label-sm">ADMIN</span>
        </div>
      </header>
      <main class="p-gutter-md flex flex-col gap-gutter-md">
        <div class="bg-light-surface-container-lowest border border-light-outline-variant rounded px-gutter-lg py-gutter-sm">
          <div class="font-headline text-headline-lg text-light-on-surface">Catálogo de Repuestos y Lista de Precios</div>
        </div>
        <div class="bg-light-surface-container-lowest border border-light-outline-variant rounded h-[520px]"></div>
      </main>
    </div>

    <!-- Modal superpuesto: Editar Precio y Datos del Repuesto -->
    <div role="dialog" aria-modal="true" aria-labelledby="modal-edit-title" class="fixed inset-0 z-50 bg-light-on-surface/50 flex items-center justify-center p-gutter-lg">
      <div class="w-full max-w-2xl bg-light-surface-container-lowest border border-light-outline-variant rounded shadow-lg overflow-hidden">
        <header class="px-gutter-lg py-gutter-md border-b border-light-outline-variant bg-light-surface-container-low flex items-center justify-between">
          <div class="flex items-center gap-gutter-sm">
            <span class="material-symbols-outlined text-[22px] text-light-primary" aria-hidden="true">edit_note</span>
            <h1 id="modal-edit-title" class="font-headline text-headline-md text-light-on-surface" data-design-text-token="headline-md">
              Editar Precio y Datos del Repuesto
            </h1>
          </div>
          <button type="button" aria-label="Cerrar" class="w-7 h-7 rounded-xs text-light-on-surface-variant hover:bg-light-surface-container inline-flex items-center justify-center">
            <span class="material-symbols-outlined text-[18px]">close</span>
          </button>
        </header>

        <div class="p-gutter-lg flex flex-col gap-gutter-md">
          <!-- Grilla de 2 columnas -->
          <div class="grid grid-cols-2 gap-gutter-md">
            <label class="flex flex-col gap-gutter-xs">
              <span class="font-label text-label-md text-light-on-surface" data-design-text-token="label-md">SKU</span>
              <input type="text" value="TOY-PAD-523" class="h-8 px-2.5 rounded-sm border border-light-outline-variant bg-light-surface-container-lowest font-mono text-mono-md text-light-on-surface focus:border-light-primary focus:ring-1 focus:ring-light-primary">
            </label>
            <label class="flex flex-col gap-gutter-xs">
              <span class="font-label text-label-md text-light-on-surface" data-design-text-token="label-md">Código OEM Común (agrupar equivalentes)</span>
              <input type="text" value="04465-0D150" class="h-8 px-2.5 rounded-sm border border-light-outline-variant bg-light-surface-container-lowest font-mono text-mono-md text-light-on-surface focus:border-light-primary focus:ring-1 focus:ring-light-primary">
            </label>
            <label class="flex flex-col gap-gutter-xs">
              <span class="font-label text-label-md text-light-on-surface" data-design-text-token="label-md">Marca</span>
              <select class="h-8 px-2.5 rounded-sm border border-light-outline-variant bg-light-surface-container-lowest font-body text-body-md text-light-on-surface focus:border-light-primary focus:ring-1 focus:ring-light-primary">
                <option selected>TOYOTA OEM</option>
                <option>DENSO</option>
                <option>AISIN</option>
                <option>ALTERNATIVO</option>
              </select>
            </label>
            <label class="flex flex-col gap-gutter-xs">
              <span class="font-label text-label-md text-light-on-surface" data-design-text-token="label-md">Categoría</span>
              <select class="h-8 px-2.5 rounded-sm border border-light-outline-variant bg-light-surface-container-lowest font-body text-body-md text-light-on-surface focus:border-light-primary focus:ring-1 focus:ring-light-primary">
                <option selected>Frenos</option>
                <option>Filtros</option>
                <option>Aceites</option>
                <option>Encendido</option>
                <option>Embrague</option>
              </select>
            </label>
            <label class="col-span-2 flex flex-col gap-gutter-xs">
              <span class="font-label text-label-md text-light-on-surface" data-design-text-token="label-md">Nombre del Repuesto</span>
              <input type="text" value="Pastillas de Freno Delanteras" class="h-8 px-2.5 rounded-sm border border-light-outline-variant bg-light-surface-container-lowest font-body text-body-md text-light-on-surface focus:border-light-primary focus:ring-1 focus:ring-light-primary">
            </label>
            <label class="col-span-2 flex flex-col gap-gutter-xs">
              <span class="font-label text-label-md text-light-on-surface" data-design-text-token="label-md">Modelos Toyota Compatibles</span>
              <input type="text" value="Yaris (14–24), Etios" class="h-8 px-2.5 rounded-sm border border-light-outline-variant bg-light-surface-container-lowest font-body text-body-md text-light-on-surface focus:border-light-primary focus:ring-1 focus:ring-light-primary">
            </label>
          </div>

          <!-- Bloque destacado de Precio de Venta -->
          <div class="p-gutter-md rounded-sm bg-light-surface-container-low border border-light-outline-variant grid grid-cols-2 gap-gutter-md items-start">
            <div class="flex flex-col gap-gutter-xs">
              <label for="price-input" class="font-label text-label-md text-light-on-surface" data-design-text-token="label-md">
                Precio de Venta S/ (inc. IGV 18%)
              </label>
              <input id="price-input" type="number" step="0.01" value="190.00" class="h-9 px-3 rounded-sm border border-light-outline-variant bg-light-surface-container-lowest font-mono text-mono-md tabular-nums text-light-on-surface focus:border-light-primary focus:ring-1 focus:ring-light-primary">
              <span id="tax-preview" class="font-mono text-mono-sm text-light-on-surface-variant" data-design-text-token="mono-sm">
                Base imponible: S/ 161.02 • IGV 18%: S/ 28.98
              </span>
            </div>
            <div class="flex flex-col gap-gutter-xs">
              <label for="min-stock-input" class="font-label text-label-md text-light-on-surface" data-design-text-token="label-md">
                Stock Mínimo de Alerta
              </label>
              <input id="min-stock-input" type="number" min="1" value="4" class="h-9 px-3 rounded-sm border border-light-outline-variant bg-light-surface-container-lowest font-mono text-mono-md tabular-nums text-light-on-surface focus:border-light-primary focus:ring-1 focus:ring-light-primary">
              <span class="font-body text-body-sm text-light-on-surface-variant" data-design-text-token="body-sm">
                Activa semáforo amarillo al alcanzar este umbral
              </span>
            </div>
          </div>
        </div>

        <footer class="px-gutter-lg py-gutter-sm border-t border-light-outline-variant bg-light-surface-container-low flex justify-end gap-gutter-sm">
          <button type="button" class="h-9 px-gutter-md rounded-sm bg-light-surface-container-lowest border border-light-outline-variant text-light-on-surface font-label text-label-md hover:bg-light-surface-container">
            <span data-design-text-token="label-md">Cancelar</span>
          </button>
          <button type="button" class="h-9 px-gutter-lg rounded-sm bg-light-primary text-light-on-primary font-label text-label-md hover:opacity-90">
            <span data-design-text-token="label-md">Guardar Cambios</span>
          </button>
        </footer>
      </div>
    </div>
  </div>

  <script>
    const priceInput = document.getElementById('price-input');
    const taxPreview = document.getElementById('tax-preview');
    priceInput.addEventListener('input', () => {
      const p = parseFloat(priceInput.value) || 0;
      const base = p / 1.18;
      const igv = p - base;
      taxPreview.textContent = `Base imponible: S/ ${base.toFixed(2)} • IGV 18%: S/ ${igv.toFixed(2)}`;
    });
  </script>
